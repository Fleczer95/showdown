plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.gameservices'
version = '1.0.0'

android {
  namespace "expo.modules.gameservices"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // 22.0.0 is the first release carrying GameStatsClient and PlayerGameEvent —
  // 21.0.0 has neither, so the Game Stats bridge cannot compile against it.
  // Verified against the published AAR, not just the docs.
  implementation 'com.google.android.gms:play-services-games-v2:22.0.0'
}
